<div 
  x-cloak 
  x-show="menu"
  class="bg-linen fixed top-90 left-0 z-50 w-full h-[calc(100dvh_-_90px)] flex flex-col justify-between pt-12 overflow-y-auto {{ class }}">
  
  <div
    x-show="menu"
    x-transition:enter="transition ease-out duration-200"
    x-transition:enter-start="opacity-0 -translate-y-8"
    x-transition:enter-end="opacity-100 translate-y-0"
    x-transition:leave="transition ease-in duration-150"
    x-transition:leave-start="opacity-100 translate-y-0"
    x-transition:leave-end="opacity-0 -translate-y-8"
    class="flex flex-col gap-y-24">

    <nav class="flex flex-col items-center px-16">
      
      <ul class="flex flex-col gap-y-12 w-full">

        {{ nav:menu }}

          {{ partial:menu/mobile/parent-item }}

        {{ /nav:menu }}

      </ul>

    </nav>
    
    {{ partial:menu/language/wrapper class="flex gap-x-48 mx-auto text-[1.25rem] mb-24" }}

  </div>

  {{ partial:menu/mobile/footer }}
  
</div>
