<li class="relative group">

  <a 
    href="{{ url }}" 
    class="block w-full py-20 font-medium xl:text-[1.25rem] leading-none tracking-wide transition-colors hover:text-blue {{ is_current || is_parent ? 'text-blue' : '' }}"
    target="{{ is_external ? '_blank' : '_self' }}"
    aria-label="{{ title }}">
    {{ menu_title ?? title }}
  </a>

  {{ if children }}
    <ul class="absolute -left-24 top-full z-50 -mt-10 bg-ivory rounded-xl p-24 flex flex-col gap-y-20 opacity-0 invisible translate-y-5 transition-all duration-150 group-hover:opacity-100 group-hover:visible group-hover:translate-y-0 group-focus-within:opacity-100 group-focus-within:visible group-focus-within:translate-y-0">
      {{ children }}
        {{ partial:menu/desktop/child-item }}
      {{ /children }}
    </ul>
  {{ /if }}

</li>
