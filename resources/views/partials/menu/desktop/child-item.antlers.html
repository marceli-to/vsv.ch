<li>
  <a 
    href="{{ url }}" 
    class="block w-full whitespace-nowrap xl:text-lg tracking-wide hover:text-blue transition-colors {{ is_current || is_parent ? 'text-blue' : '' }}"
    target="{{ is_external ? '_blank' : '_self' }}"
    aria-label="{{ title }}">
    {{ menu_title ?? title }}
  </a>
</li>
