<div
  class="flex-1 flex flex-col items-center"
  data-bar
  data-active="{{ active_members }}"
  data-partner="{{ partner_members }}"
  data-individual="{{ individual_members }}">

  <div class="w-full flex flex-col items-center justify-end flex-1">
    {{ partial:fieldsets/membership/segment segment="individual" value="{individual_members}" }}
    {{ partial:fieldsets/membership/segment segment="partner" value="{partner_members}" }}
    {{ partial:fieldsets/membership/segment segment="active" value="{active_members}" }}
  </div>

  <div class="mt-8 md:mt-16 text-sm md:text-base lg:text-md">
    {{ year }}
  </div>

</div>
