<div class="bg-mist rounded-xl px-16 lg:px-20 py-12 lg:py-16" data-stat-card>
  <div class="text-5xl md:text-7xl lg:text-8xl xl:text-10xl leading-none mb-4 lg:mb-8">
    {{ if prefix }}
      <span>{{ prefix }}</span>
    {{ /if }}
    <span class="tabular-nums" data-count>{{ number }}</span>
    {{ if suffix }} 
      <span>{{ suffix }}</span>
    {{ /if }}
  </div>
  <div class="text-xs md:text-sm lg:text-base leading-snug font-bold">
    {{ label }}
  </div>
</div>
