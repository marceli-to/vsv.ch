<div class="swiper-slide">
  <div class="bg-white rounded-xl overflow-hidden p-12 md:p-16 lg:p-24 pb-24 md:pb-28 lg:pb-32">
    <div data-gallery-inner class="swiper rounded-lg overflow-hidden">
      <div class="swiper-wrapper">
        {{ gallery_images }}
          <div class="swiper-slide">
            {{ partial:components/media/image :image="image" sizes="md|lg|xl|2xl" class="w-full rounded-lg" }}
          </div>
        {{ /gallery_images }}
      </div>
      <div class="swiper-pagination hidden"></div>
    </div>
    {{ if gallery_caption }}
      <div data-gallery-caption class="pt-12 md:pt-16">
        {{ gallery_caption }}
      </div>
    {{ /if }}
  </div>
</div>
