<div class="grid grid-cols-1 md:grid-cols-[8rem_1fr] lg:grid-cols-[9rem_1fr] md:gap-x-16 lg:gap-x-24 {{ unless first }} md:mt-12 lg:mt-16 {{ /unless }}">

  <div class="flex flex-col md:items-center md:gap-16 lg:gap-20 md:pt-4">
    <div class="self-start md:self-auto inline-flex shrink-0 bg-mist text-blue text-[0.8125rem] md:text-[0.875rem] lg:text-[1rem] font-semibold tabular-nums rounded-full px-10 py-4 lg:py-6 lg:px-16 leading-none whitespace-nowrap my-12 md:my-0">
      {{ year }}
    </div>
    {{ unless last }}
      <div class="hidden md:block w-px grow bg-sand"></div>
    {{ /unless }}
  </div>

  <div class="pb-24 md:pb-48 max-w-3xl">
    <h3 class="text-[1.125rem] md:text-[1.375rem] lg:text-[1.625rem] leading-[1.3] font-medium text-pretty">
      {{ entry_title }}
    </h3>
    {{ if description }}
      <p class="mt-6 md:mt-8 text-[1rem] md:text-[1.0625rem] lg:text-[1.125rem] leading-[1.5] text-pretty">
        {{ description }}
      </p>
    {{ /if }}
  </div>

</div>
