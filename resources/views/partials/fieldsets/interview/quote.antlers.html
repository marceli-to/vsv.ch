<blockquote class="font-bold md:text-lg xl:text-2xl">
  {{ if site:locale == 'fr_CH' }}
    &laquo; {{ quote }}&nbsp;&raquo;
    {{ if author }}
      <span class="text-base lg:text-lg font-normal block mt-2">
        {{ author }}
      </span>
    {{ /if }}
  {{ else }}
    &laquo;{{ quote }}&raquo;
    {{ if author }}
      <span class="text-base lg:text-lg font-normal block mt-2">
        {{ author }}
      </span>
    {{ /if }}
  {{ /if }}
</blockquote>
</blockquote>
