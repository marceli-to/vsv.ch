<div
  {{ if slug }}id="{{ slug }}"{{ /if }}
  x-data="{ open: {{ open ? 'true' : 'false' }} }"
  x-init="
    if (window.location.hash === '#{{ slug }}') {
      open = true;
      $nextTick(() => $el.scrollIntoView({ behavior: 'smooth', block: 'start' }));
    }
  "
  @hashchange.window="
    if (window.location.hash === '#{{ slug }}') {
      open = true;
      $nextTick(() => $el.scrollIntoView({ behavior: 'smooth', block: 'start' }));
    }
  "
  class="{{ class }}">
  {{ slot }}
</div>
