title: Page
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
              localizable: true
          -
            handle: elements
            field:
              type: replicator
              display: Inhaltselemente
              collapse: true
              localizable: true
              sets:
                elemente:
                  display: Elemente
                  sets:
                    teasers:
                      display: Teasers
                      instructions: 'Add a grid of teaser cards with image, title, subtitle and link.'
                      icon: text-formatting-image-top
                      fields:
                        -
                          handle: teasers
                          field:
                            type: replicator
                            display: Teasers
                            collapse: true
                            localizable: true
                            sets:
                              teaser_items:
                                display: Teaser
                                sets:
                                  teaser:
                                    display: Teaser
                                    icon: text-formatting-image-top
                                    fields:
                                      -
                                        import: teaser
                    editorial:
                      display: Editorial
                      instructions: 'Image with subtitle, title and rich text content.'
                      icon: text-formatting-image-left
                      fields:
                        -
                          import: editorial
                    title_text_sidebar:
                      display: 'Title, Text, Sidebar'
                      instructions: 'Title with rich text content, optional table elements and an optional sidebar.'
                      icon: layout-sidebar-right
                      fields:
                        -
                          import: title_text_sidebar
  settings:
    display: Settings
    sections:
      -
        display: Settings
        fields:
          -
            import: settings
  seo:
    display: SEO
    sections:
      -
        display: SEO
        fields:
          -
            import: seo
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
              show_regenerate: true
          -
            handle: parent
            field:
              type: entries
              collections:
                - pages
              max_items: 1
              listable: false
              localizable: true
