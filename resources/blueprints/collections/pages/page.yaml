title: Page
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
              localizable: true
          -
            handle: elements
            field:
              type: replicator
              display: Inhaltselemente
              collapse: true
              localizable: true
              sets:
                elemente:
                  display: Elemente
                  sets:
                    teasers:
                      display: Teasers
                      instructions: 'Add a grid of teaser cards with image, title, subtitle and link.'
                      icon: text-formatting-image-top
                      fields:
                        -
                          handle: teasers
                          field:
                            type: replicator
                            display: Teasers
                            collapse: true
                            localizable: true
                            sets:
                              teaser_items:
                                display: Teaser
                                sets:
                                  teaser:
                                    display: Teaser
                                    icon: text-formatting-image-top
                                    fields:
                                      -
                                        import: teaser
                    editorial:
                      display: Editorial
                      instructions: 'Image with subtitle, title and rich text content.'
                      icon: text-formatting-image-left
                      fields:
                        -
                          import: editorial
                    title_text:
                      display: 'Title, Text'
                      instructions: 'Title with rich text content and optional table elements.'
                      icon: text-formatting-image-left
                      fields:
                        -
                          import: title_text
                    title_text_sidebar:
                      display: 'Title, Text, Sidebar'
                      instructions: 'Title with rich text content, optional table elements and an optional sidebar.'
                      icon: layout-sidebar-left
                      fields:
                        -
                          import: title_text_sidebar
                    accordion:
                      display: Accordion
                      instructions: 'Collapsible content sections with theme, title and editor/table content.'
                      icon: form-drop-down-menu
                      fields:
                        -
                          import: accordion
                    statistics:
                      display: Statistics
                      instructions: 'Key figures with number and description.'
                      icon: money-graph-bar-increase
                      fields:
                        -
                          import: statistics
                    partners:
                      display: Partners
                      instructions: 'Main partners and partners with logos and links.'
                      icon: user-multiple
                      fields:
                        -
                          import: partners
                    interview:
                      display: Interview
                      instructions: 'Interview with image, title and Q&A content blocks.'
                      icon: text-formatting-image-top
                      fields:
                        -
                          import: interview
                    events:
                      display: Events
                      instructions: 'Event listing with search and filter functionality.'
                      icon: calendar-date
                      fields:
                        -
                          import: events
                    membership:
                      display: Membership
                      instructions: 'Membership data'
                      icon: money-graph-pie-chart
                      fields:
                        -
                          import: membership
                    timeline:
                      display: Timeline
                      instructions: 'Timeline with title.'
                      icon: calendar-date
                      fields:
                        -
                          import: timeline
                    gallery:
                      display: Gallery
                      instructions: 'Image gallery with nested photo slideshows.'
                      icon: media-image-picture-orientation
                      fields:
                        -
                          import: gallery
                    statistics_report:
                      display: 'Statistics Report'
                      instructions: 'Full statistics page with key figures, text, comparison tables and pie charts.'
                      icon: money-graph-bar-increase
                      fields:
                        -
                          import: statistics_report
                    archive:
                      display: Archive
                      instructions: 'Archive cards with category label, title and download/website link.'
                      icon: content-book-open
                      fields:
                        -
                          handle: title
                          field:
                            type: text
                            display: Title
                            localizable: false
                        -
                          handle: archive_items
                          field:
                            type: replicator
                            display: 'Archive Items'
                            collapse: true
                            localizable: true
                            sets:
                              archive_item_group:
                                display: 'Archive Item'
                                sets:
                                  archive_item:
                                    display: 'Archive Item'
                                    icon: content-book-open
                                    fields:
                                      -
                                        import: archive_item
  settings:
    display: Settings
    sections:
      -
        display: Settings
        fields:
          -
            import: settings
  seo:
    display: SEO
    sections:
      -
        display: SEO
        fields:
          -
            import: seo
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
              show_regenerate: true
          -
            handle: parent
            field:
              type: entries
              collections:
                - pages
              max_items: 1
              listable: false
              localizable: true
