title: Page
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
              localizable: true
          -
            handle: elements
            field:
              type: replicator
              display: Inhaltselemente
              collapse: true
              localizable: true
              sets:
                elemente:
                  display: Elemente
                  sets:
                    new_set:
                      display: 'New Set'
                      fields: {  }
  settings:
    display: Settings
    sections:
      -
        display: Settings
        fields:
          -
            import: settings
  seo:
    display: SEO
    sections:
      -
        display: SEO
        fields:
          -
            import: seo
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
          -
            handle: parent
            field:
              type: entries
              collections:
                - pages
              max_items: 1
              listable: false
              localizable: true
