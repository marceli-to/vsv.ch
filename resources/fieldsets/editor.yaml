title: Editor
fields:
  -
    handle: editor_content
    field:
      buttons:
        - h1
        - h2
        - h3
        - bold
        - italic
        - unorderedlist
        - removeformat
        - anchor
        - lead
      toolbar_mode: floating
      remove_empty_nodes: true
      type: bard
      display: Inhalt
      container: assets
      localizable: true
      sets:
        content:
          display: Content
          sets:
            board:
              display: Board
              instructions: 'Add a role-based member list with grouped roles and members.'
              icon: user-multiple
              fields:
                -
                  import: board
