title: 'Theme selector'
fields:
  -
    handle: theme
    field:
      type: select
      display: Theme
      options:
        -
          key: sky
          value: Blue
        -
          key: mist
          value: 'Light blue'
        -
          key: sand
          value: Beige
        -
          key: blush
          value: Pink
        -
          key: white
          value: White
      default: sky
      localizable: false
