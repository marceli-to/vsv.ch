title: Accordion
fields:
  -
    handle: items
    field:
      type: replicator
      display: Items
      collapse: true
      localizable: true
      instructions: 'Add accordion items.'
      sets:
        accordion_items:
          display: Items
          sets:
            accordion_item:
              display: 'Accordion Item'
              instructions: 'Add an accordion item with title and content.'
              icon: form-drop-down-menu
              fields:
                -
                  handle: open
                  field:
                    type: toggle
                    display: Open
                    instructions: 'If enabled, this item is open by default.'
                    localizable: false
                    default: false
                -
                  import: theme_selector
                -
                  handle: title
                  field:
                    type: text
                    display: Title
                    localizable: true
                -
                  handle: content
                  field:
                    type: replicator
                    display: Content
                    collapse: true
                    localizable: true
                    instructions: 'Add content blocks for this accordion item.'
                    sets:
                      accordion_content:
                        display: Content
                        sets:
                          editor:
                            display: Editor
                            instructions: 'Add text content.'
                            icon: text-formatting-markdown
                            fields:
                              -
                                import: editor
                          board:
                            display: Board
                            instructions: 'Add a role-based member list with grouped roles and members.'
                            icon: user-multiple
                            fields:
                              -
                                import: board
                          interview:
                            display: Interview
                            instructions: 'Interview with image, title and Q&A content blocks.'
                            icon: text-formatting-image-top
                            fields:
                              -
                                import: interview
                          title_text_sidebar:
                            display: 'Title, Text, Sidebar'
                            instructions: 'Title with rich text content, optional table elements and an optional sidebar.'
                            icon: layout-sidebar-left
                            fields:
                              -
                                import: title_text_sidebar
                          events:
                            display: Events
                            instructions: 'Event listing with search and filter functionality.'
                            icon: calendar-date
                            fields:
                              -
                                import: events
