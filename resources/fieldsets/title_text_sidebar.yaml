title: 'Title, Text, Sidebar'
fields:
  -
    handle: main
    field:
      type: section
      display: Main
      localizable: false
  -
    handle: title
    field:
      type: text
      display: Titel
      localizable: true
  -
    import: editor
  -
    handle: sub_elements
    field:
      type: replicator
      display: Elemente
      collapse: true
      localizable: true
      sets:
        sub_elemente:
          display: Elemente
          sets:
            table:
              display: Table
              instructions: 'Add a data table with title and style options.'
              icon: layout-table
              fields:
                -
                  import: table
  -
    handle: sidebar
    field:
      type: section
      display: Sidebar
      localizable: false
  -
    import: editor
    prefix: sidebar_
